name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            targets: --win
          - os: ubuntu-latest
            targets: --linux
          - os: macos-latest
            targets: --mac --arm64 --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish desktop
        run: pnpm --filter @lolzteam/desktop exec electron-vite build && pnpm --filter @lolzteam/desktop exec electron-builder ${{ matrix.targets }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUNCHER_TELEMETRY_KEY: ${{ secrets.LAUNCHER_TELEMETRY_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
